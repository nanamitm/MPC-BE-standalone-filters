name: Build and release standalone filters

# Standalone-filter distribution for this fork's own fixes/improvements,
# developed independently of upstream (Aleksoid1978/MPC-BE) - see
# https://github.com/Aleksoid1978/MPC-BE/pull/1165 for why the first one of
# these didn't get merged upstream. Builds the standalone video decoder,
# audio renderer, audio decoder and Audio Switcher (x64). All share one
# version number (include/Version.h + git describe), each in its own zip.

on:
  push:
    # No hyphens: update_revision.cmd splits `git describe --long` on "-" and
    # assumes the tag itself contributes exactly one token, so a hyphenated
    # tag (e.g. decoder-v...) shifts the count/hash fields and breaks REV_NUM.
    tags: ['v*']
  # Build-only check for PRs; the release upload step below runs for tags only.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare MSYS
        run: |
          curl -sSL https://github.com/Aleksoid1978/MSYS/raw/main/MSYS_MinGW-w64_GCC_1521_x86-x64.7z -o MSYS.7z
          7z x MSYS.7z -oC:\\MSYS
          echo '@ECHO OFF' > environments.bat
          echo 'SET "MPCBE_MSYS=C:\\MSYS"' >> environments.bat
          echo 'SET "MPCBE_MINGW=C:\\MSYS\\mingw"' >> environments.bat
          .\\update_gcc.bat
        shell: pwsh

      - name: Build filters (x64 Release)
        run: |
          .\\build.bat Build x64 Filters Release NoWait
        shell: pwsh

      - name: Test audio decoder and Switcher (no endpoint required)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          call tests\run_audio_decoder_tests.cmd _bin\Filters_x64

      - name: Stage release files
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($name in 'MPCVideoDec-fork', 'MpcAudioRenderer-fork', 'MpaDecFilter-fork', 'AudioSwitcher-fork') {
            $package = "dist\$name"
            New-Item -ItemType Directory -Force -Path $package | Out-Null
            Copy-Item "_bin\Filters_x64\$name.ax" $package
            Copy-Item "LICENSE.txt" $package
            Copy-Item "scripts\Install_${name}_64.cmd" $package
            Copy-Item "scripts\Uninstall_${name}_64.cmd" $package
            # Publish only runtime files, registration helpers and the license.
            # Source headers (including IAudioDualMono.h) are not release assets.
            $files = @(
              "$package\$name.ax",
              "$package\Install_${name}_64.cmd",
              "$package\Uninstall_${name}_64.cmd",
              "$package\LICENSE.txt"
            )
            Compress-Archive -LiteralPath $files -DestinationPath "dist\$name-x64.zip" -Force
          }
          Get-ChildItem dist\*.zip | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: filters-x64
          path: |
            dist\*.zip
            dist\SHA256SUMS.txt

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist\MPCVideoDec-fork-x64.zip
            dist\MpcAudioRenderer-fork-x64.zip
            dist\MpaDecFilter-fork-x64.zip
            dist\AudioSwitcher-fork-x64.zip
            dist\SHA256SUMS.txt
          generate_release_notes: true
